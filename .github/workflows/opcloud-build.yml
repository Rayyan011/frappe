name: Build Stackable OpCloud
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: opcloud-image-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Check pinned upstream branches
        run: |
          python3 - <<'PY'
          import json, subprocess
          manifest = json.load(open('deploy/opcloud/manifest.json'))
          for app in json.load(open('deploy/opcloud/apps-ci.json')):
              name = app['url'].rstrip('/').split('/')[-1]
              expected = manifest['apps'][name]
              actual = subprocess.check_output(['git', 'ls-remote', app['url'], 'refs/heads/' + app['branch']], text=True).split()[0]
              if actual != expected:
                  raise SystemExit(f'{name}: branch changed; update and review the pinned revision before rebuilding')
              print(f'{name}: {actual}')
          PY
      - name: Get pinned Frappe Docker build tools
        run: |
          git clone https://github.com/frappe/frappe_docker.git /tmp/frappe_docker
          git -C /tmp/frappe_docker checkout fbf76edcf5791b1d9743955b85caf0a19974d5a6
          cp deploy/opcloud/apps-ci.json /tmp/apps.json
          cp deploy/opcloud/Containerfile.ci /tmp/frappe_docker/Containerfile.opcloud-ci
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: /tmp/frappe_docker
          file: /tmp/frappe_docker/Containerfile.opcloud-ci
          platforms: linux/amd64
          push: false
          build-args: |
            FRAPPE_PATH=https://github.com/Rayyan011/frappe
            FRAPPE_BRANCH=stackables-branding
          secret-files: |
            apps_json=/tmp/apps.json
